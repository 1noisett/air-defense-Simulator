<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Defense Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Air Defense Simulator</h1>
            <p class="subtitle">Multi-layer anti-aircraft defense simulation</p>
        </div>
    </header>

    <div id="system-cards" class="system-cards"></div>

    <main>
        <aside id="controls">
            <div class="slider-group">
                <div class="slider-header">
                    <span class="label-text">Threats</span>
                    <span class="label-value" id="n-threats-val">3</span>
                </div>
                <input type="range" id="n-threats" value="3" min="1" max="5">
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <span class="label-text">Inventory</span>
                    <span class="label-value" id="inventory-val">2</span>
                </div>
                <input type="range" id="inventory" value="2" min="0" max="5">
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <span class="label-text">Launch angle</span>
                    <span class="label-value" id="launch-angle-val">45°</span>
                </div>
                <input type="range" id="launch-angle" value="45" min="15" max="75">
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <span class="label-text">Zone width</span>
                    <span class="label-value" id="zone-width-val">350 m</span>
                </div>
                <input type="range" id="zone-width" value="350" min="100" max="1000">
            </div>

            <button id="simulate-btn">Simulate</button>

            <section id="results" hidden>
                <h2>Results</h2>
                <div class="result-row">
                    <span class="result-label">Neutralized</span>
                    <span class="result-value" id="r-neutralized"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Leaked</span>
                    <span class="result-value danger" id="r-leaked"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Safe</span>
                    <span class="result-value success" id="r-safe"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Inventory left</span>
                    <span class="result-value" id="r-inventory"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Duration</span>
                    <span class="result-value"><span id="r-time"></span> s</span>
                </div>
            </section>

            <p id="error-msg" hidden></p>
        </aside>

        <section id="canvas-area">
            <canvas id="sim-canvas" width="800" height="500"></canvas>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
