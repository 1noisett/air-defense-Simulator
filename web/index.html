<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Defense Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Air Defense Simulator</h1>
            <p class="subtitle">Multi-layer anti-aircraft defense simulation</p>
        </div>
    </header>

    <div id="system-cards" class="system-cards"></div>

    <main>
        <aside id="controls">
            <div class="slider-group">
                <div class="slider-header">
                    <span class="label-text">Threats</span>
                    <span class="label-value" id="n-threats-val">3</span>
                </div>
                <input type="range" id="n-threats" value="3" min="1" max="5">
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <span class="label-text">Inventory</span>
                    <span class="label-value" id="inventory-val">2</span>
                </div>
                <input type="range" id="inventory" value="2" min="0" max="5">
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <span class="label-text">Launch angle</span>
                    <span class="label-value" id="launch-angle-val">45°</span>
                </div>
                <input type="range" id="launch-angle" value="45" min="15" max="75">
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <span class="label-text">Zone width</span>
                    <span class="label-value" id="zone-width-val">700 m</span>
                </div>
                <input type="range" id="zone-width" value="700" min="200" max="1500">
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <span class="label-text">Maneuvering</span>
                    <span class="label-value" id="maneuver-val">0%</span>
                </div>
                <input type="range" id="maneuver" value="0" min="0" max="100">
            </div>

            <button id="simulate-btn">Simulate</button>

            <p id="error-msg" hidden></p>
        </aside>

        <section id="canvas-area">
            <canvas id="sim-canvas" width="1600" height="600"></canvas>
            <div id="canvas-controls">
                <button id="pause-btn" title="Pause / Play">⏸</button>
                <span class="ctrl-label">Speed</span>
                <input type="range" id="speed-slider" min="0.5" max="2" step="0.5" value="1">
                <span id="speed-label">1×</span>
            </div>
        </section>

        <aside id="telemetry">
            <section id="active-system">
                <h2>Active system</h2>
                <div class="as-name" id="as-name">—</div>
                <div class="as-country" id="as-country">—</div>
            </section>

            <section id="hud-panel">
                <h2>Live status</h2>
                <div class="hud-row"><span class="hud-key">RADAR</span><span class="hud-val" id="hud-radar">STANDBY</span></div>
                <div class="hud-row"><span class="hud-key">CLOCK</span><span class="hud-val" id="hud-clock">0.00 s</span></div>
                <div class="hud-row"><span class="hud-key">INTERCEPTORS</span><span class="hud-val" id="hud-interceptors">0/0</span></div>
                <div class="hud-row"><span class="hud-key">THREATS</span><span class="hud-val" id="hud-threats">0</span></div>
            </section>

            <section id="results" hidden>
                <h2>Results</h2>
                <div class="result-row">
                    <span class="result-label">Neutralized</span>
                    <span class="result-value" id="r-neutralized"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Leaked</span>
                    <span class="result-value danger" id="r-leaked"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Safe</span>
                    <span class="result-value success" id="r-safe"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Inventory left</span>
                    <span class="result-value" id="r-inventory"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Duration</span>
                    <span class="result-value" id="r-time"></span>
                </div>
            </section>
        </aside>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
